version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgre
      POSTGRES_DB: projeto
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: node_app
    restart: always
    ports:
      - "3333:3333"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgre
      DB_DATABASE: projeto
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deployment}
      PORT: 3333
    depends_on:
      - postgres
